<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071222"><title>Sign In | AeroScope ONE</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#071222;color:#f5faff;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column}nav{padding:20px;display:flex;justify-content:space-between;align-items:center;background:#0b1830}a{color:#85cbff;text-decoration:none}.brand{font-weight:800;font-size:20px}.brand span{color:#5bc5ff}main{flex:1;display:grid;place-items:center;padding:30px 18px}.panel{max-width:420px;width:100%;background:#10233e;border:1px solid #325177;border-radius:22px;padding:34px 25px;box-shadow:0 20px 55px #0006}.mark{height:68px;width:68px;border-radius:18px;background:#1766bd;display:grid;place-items:center;font-size:38px;margin-bottom:22px}h1{font-size:29px;margin:0 0 10px}p{color:#b5c9db;line-height:1.6}button{width:100%;background:white;border:0;color:#15243b;border-radius:12px;min-height:53px;font-size:16px;font-weight:700;cursor:pointer;margin:20px 0 8px}button:disabled{opacity:.55;cursor:not-allowed}.g{display:inline-flex;align-items:center;justify-content:center;gap:12px}.g svg{width:19px;height:19px}.status{font-size:13px;line-height:1.5;min-height:28px;color:#a7bdd3;margin-top:10px}.status.error{color:#ffb7b7}.small{font-size:12px;color:#92a7bf}.small a{color:#a4dcff}footer{text-align:center;padding:18px;color:#8ea6bf;font-size:12px}footer a{margin:0 9px}.aero-wordmark{display:inline-flex;align-items:baseline;gap:0;color:#79c8ff;font-family:Arial,Helvetica,sans-serif;font-weight:800;letter-spacing:-.75px;white-space:nowrap;font-size:25px;line-height:1}.aero-symbol{width:31px;height:26px;flex-shrink:0;align-self:baseline;vertical-align:baseline;position:relative;top:3px;margin-right:0;overflow:visible}.aero-word{color:#79c8ff}.aero-one{color:#79c8ff;margin-left:.36em;font-size:1em;letter-spacing:-.75px}.aero-one sup{font-size:.36em;vertical-align:super;margin-left:.05em}@media(max-width:500px){.aero-wordmark{font-size:20px}.aero-symbol{width:26px;height:23px;top:3px}}</style></head><body><nav><a href="/" class="brand" aria-label="AeroScope Home"><span class="aero-wordmark"><svg class="aero-symbol" viewBox="0 0 102 76" role="img" aria-label="AeroScope logo"><path d="M9 70 40 6 Q43 1 47 6 L78 70 H60 L44 32 27 70Z" fill="#75bdff"/><path d="M4 58 C27 66 60 51 91 24" fill="none" stroke="#e7f7ff" stroke-width="6" stroke-linecap="round"/><path d="M77 21 95 9 89 29 83 23 75 29Z" fill="#75bdff"/></svg><span class="aero-word">eroScope</span><span class="aero-one">ONE<sup>™</sup></span></span></a><a href="/">← Back to radar</a></nav><main><div class="panel"><div class="mark">✈</div><h1>Welcome aboard.</h1><p>Sign in or create an account securely with Google to access AeroScope ONE.</p><button id="google" disabled><span class="g"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.7c3.9-3.6 6-8.8 6-15z"/><path fill="#34A853" d="M24 44c5.4 0 10-1.8 13.4-4.8l-6.7-5.1c-1.8 1.2-4.1 1.9-6.7 1.9-5.1 0-9.4-3.4-11-8H6v5.2C9.3 39.8 16.1 44 24 44z"/><path fill="#FBBC05" d="M13 28a12 12 0 0 1 0-8v-5.2H6a20 20 0 0 0 0 18.4l7-5.2z"/><path fill="#EA4335" d="M24 12c2.9 0 5.5 1 7.5 2.9l5.9-5.9C33.8 5.8 29.2 4 24 4 16.1 4 9.3 8.2 6 14.8l7 5.2c1.6-4.6 5.9-8 11-8z"/></svg> Continue with Google</span></button><div id="status" class="status" role="status" aria-live="polite">Checking sign-in availability…</div><p class="small">By signing in you acknowledge our <a href="https://aeroscope-legal-pages.vercel.app/terms">Terms of Service</a> and <a href="https://aeroscope-legal-pages.vercel.app/privacy">Privacy Policy</a>.</p></div></main><footer>© 2026 AeroScope ONE™ <a href="mailto:aeroscopefly@gmail.com">Support</a></footer><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
const btn=document.getElementById('google'),status=document.getElementById('status');
function msg(t,error=false){status.textContent=t;status.className='status'+(error?' error':'')}
try {
 const response=await fetch('/firebase-config.json',{cache:'no-store'});
 if(!response.ok) throw Error('Google sign-in has not been configured yet.');
 const config=await response.json();
 if(!config.apiKey||!config.authDomain||!config.projectId||!config.appId)throw Error('Google sign-in configuration is incomplete.');
 const auth=getAuth(initializeApp(config));const provider=new GoogleAuthProvider();
 provider.setCustomParameters({prompt:'select_account'});
 btn.disabled=false;msg('Sign in to continue.');
 onAuthStateChanged(auth,user=>{if(user){msg('Signed in as '+(user.email||user.displayName||'Google user'));btn.textContent='Sign out';btn.onclick=async()=>{await signOut(auth);location.reload()}}});
 getRedirectResult(auth).catch(e=>msg('Google sign-in could not finish: '+e.code,true));
 if(!auth.currentUser)btn.onclick=async()=>{btn.disabled=true;msg('Opening Google sign-in…');try{if(/iPhone|iPad|iPod/.test(navigator.userAgent))await signInWithRedirect(auth,provider);else await signInWithPopup(auth,provider)}catch(e){msg('Sign-in failed: '+e.code,true);btn.disabled=false}};
} catch(e){msg(e.message+' The site administrator must enable Google Authentication first.',true);}
</script></body></html>

let historicalLookupCount=0; // Each aircraft history is fetched at most once per page session.
async function loadHistoricalFlightTrail(a,hex){
 const id=String(hex||'').toLowerCase();
 if(!/^[0-9a-f]{6}$/.test(id)||historicalLookups.has(id)||historicalLookupCount>=12)return;
 if(Number(a?.dbFlags||0)&12){
  const hint=panel.querySelector('#trail-status');if(hint)hint.textContent='Historical trace withheld: aircraft has a PIA or LADD privacy flag.';
  return;
 }
 historicalLookups.add(id);historicalLookupCount++;
 try{
  const url='/api/flight-trail-history?hex='+encodeURIComponent(id)+'&callsign='+encodeURIComponent(String(a?.flight||'').trim());
  const res=await fetch(url,{cache:'no-store'});

   if(activeHex===id){const hint=panel.querySelector('#trail-status');

   }
   return;
  }
  const points=data.points.filter(p=>Array.isArray(p)&&p.length===3&&Number.isFinite(p[0])&&Number.isFinite(p[1])&&Number.isFinite(p[2]));
  if(points.length<2)return;

   if(hint)hint.textContent='Historical path: '+data.pointCount+' reported positions • '+data.attribution;
  }
 }catch{/* Keep locally collected tracks as the reliable fallback. */}
}

try{

// Approximate great-circle route reference, not a filed/actual flight trajectory.
function routeArc(a,b){
 const rad=Math.PI/180,lat1=a[1]*rad,lat2=b[1]*rad,lon1=a[0]*rad,lon2=b[0]*rad;
 const u=[Math.cos(lat1)*Math.cos(lon1),Math.cos(lat1)*Math.sin(lon1),Math.sin(lat1)],v=[Math.cos(lat2)*Math.cos(lon2),Math.cos(lat2)*Math.sin(lon2),Math.sin(lat2)];
 const theta=Math.acos(Math.max(-1,Math.min(1,u[0]*v[0]+u[1]*v[1]+u[2]*v[2])));
 if(theta<0.000001)return [a,b];const sn=Math.sin(theta),out=[];
 for(let i=0;i<=36;i++){const t=i/36,p=Math.sin((1-t)*theta)/sn,q=Math.sin(t*theta)/sn,x=p*u[0]+q*v[0],y=p*u[1]+q*v[1],z=p*u[2]+q*v[2];out.push([Math.atan2(y,x)/rad,Math.atan2(z,Math.hypot(x,y))/rad])}
 return out;
}
// A trail is recorded history, not a projection. Feed gaps remain gaps.
function recordedSegments(points){
 const segments=[];let segment=[];
 for(const p of points){
  if(!Array.isArray(p)||!Number.isFinite(p[0])||!Number.isFinite(p[1])||!Number.isFinite(p[2]))continue;
  const prev=segment.at(-1);
  if(prev){
   const dt=(p[2]-prev[2])/1000;
   const km=111.2*Math.hypot(p[1]-prev[1],(p[0]-prev[0])*Math.cos(p[1]*Math.PI/180));
   if(dt<=0)continue;
   // Allow normal 20-second updates and brief network delays; never bridge large gaps/teleports.
   if(dt>95||km>Math.max(2.5,dt*.38)){
    if(segment.length>1)segments.push(segment);
    segment=[];
   }
  }
  segment.push(p);
 }
 if(segment.length>1)segments.push(segment);
 return segments;
}

   map.addLayer({id:'aeroscope-airport-dots',type:'circle',source:'aeroscope-airports',minzoom:3,paint:{'circle-radius':['interpolate',['linear'],['zoom'],3,2.5,9,5],'circle-color':'#ffe494','circle-stroke-color':'#172f4d','circle-stroke-width':1.5}});

 if(map.getZoom()>=6){
  const bounds=map.getBounds();
  let shown=0;
  for(const a of aircraft){
   if(shown>=65)break;
   if(!a.hex||a.hex===activeHex||!Number.isFinite(a.lon)||!Number.isFinite(a.lat)||!bounds.contains([a.lon,a.lat]))continue;
   const observed=recentTracks.get(String(a.hex).toLowerCase());
   if(!observed||observed.length<2||Date.now()-observed.at(-1)[2]>95000)continue;

   for(const part of segments)features.push({type:'Feature',properties:{kind:'background'},geometry:{type:'LineString',coordinates:part.map(p=>[p[0],p[1]])}});

function rememberAircraftPositions(list){

  const hex=String(a.hex||'').toLowerCase();
  if(!/^[0-9a-f]{6}$/.test(hex)||!Number.isFinite(a.lat)||!Number.isFinite(a.lon))continue;
  if(Number(a.dbFlags||0)&12){recentTracks.delete(hex);trackCallsigns.delete(hex);continue}
  const age=Number(a.seen_pos);
  if(Number.isFinite(age)&&age>75)continue; // Skip stale or untrusted feed locations.
  const reportedAt=receivedAt-(Number.isFinite(age)?Math.max(0,age)*1000:0);

  const previousCall=trackCallsigns.get(hex);

  if(call&&previousCall&&call!==previousCall)recentTracks.delete(hex);

  if(!pts){pts=[];recentTracks.set(hex,pts)}

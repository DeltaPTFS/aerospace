<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071222"><title>AeroScope ONE</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="apple-touch-icon" href="/favicon.svg"><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#071222;color:#f2f8ff;font:15px -apple-system,BlinkMacSystemFont,Arial,sans-serif}header{height:65px;display:flex;justify-content:space-between;align-items:center;padding:12px 17px;background:#0b1830}b{letter-spacing:.3px}.brand{font-size:20px}.brand span{color:#59c8ff}button,input{font:inherit}button{background:#172f4d;border:1px solid #355679;border-radius:12px;color:white;padding:11px 14px;cursor:pointer}button.active{background:#176aa0}nav{display:flex;gap:7px;overflow:auto;padding:10px;background:#0d1b31}nav button{white-space:nowrap}#map{position:relative;height:calc(100dvh - 202px);min-height:300px}#status{padding:8px 13px;font-size:12px;background:#11263d;color:#a9d8f4;min-height:34px}#panel{background:#0b1a30;padding:12px 15px;min-height:80px}#panel p{margin:6px 0;color:#b8cadb}#toolbar{position:absolute;z-index:2;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none}#toolbar>*{pointer-events:auto}#search{width:100%;min-width:0;background:#0a2038;color:#fff;border:1px solid #47708f;border-radius:12px;padding:12px}#refresh{white-space:nowrap}.plane{font-size:20px;line-height:1;color:#04d5ff;text-shadow:0 0 3px #002f50;cursor:pointer}#other{padding:20px;display:none}small{color:#acc4d3}.maplibregl-popup-content{background:#10263d;color:#fff;border-radius:10px}.maplibregl-popup-tip{border-top-color:#10263d!important}.maplibregl-ctrl-group button{padding:0}@media(max-width:500px){header{height:58px}#map{height:calc(100dvh - 210px)}.brand{font-size:18px}} header .signin{color:white;background:#176aa0;border:1px solid #4789b5;border-radius:10px;padding:9px 12px;font-size:13px;text-decoration:none;white-space:nowrap}header .headright{display:flex;align-items:center;gap:10px}header .headright small{white-space:nowrap}@media(max-width:550px){header .headright small{display:none}}.aero-wordmark{display:inline-flex;align-items:baseline;gap:0;color:#79c8ff;font-family:Arial,Helvetica,sans-serif;font-weight:800;letter-spacing:-.75px;white-space:nowrap;font-size:25px;line-height:1}.aero-symbol{width:31px;height:26px;flex-shrink:0;align-self:baseline;vertical-align:baseline;position:relative;top:3px;margin-right:-5px;overflow:visible}.aero-word{color:#79c8ff}.aero-one{color:#79c8ff;margin-left:.25em;font-size:1em;letter-spacing:-.75px}.aero-one sup{font-size:.40em;position:relative;top:-.52em;vertical-align:baseline;margin-left:.05em;line-height:0}@media(max-width:500px){.aero-wordmark{font-size:20px}.aero-symbol{width:26px;height:23px;top:3px;margin-right:-4px}}</style><link rel="stylesheet" href="/enhancements.css"></head><body><header><div class="brand"><span class="aero-wordmark"><svg class="aero-symbol" viewBox="0 0 102 76" role="img" aria-label="AeroScope logo"><path d="M9 70 40 6 Q43 1 47 6 L78 70 H60 L44 32 27 70Z" fill="#75bdff"/><path d="M4 58 C27 66 60 51 91 24" fill="none" stroke="#e7f7ff" stroke-width="6" stroke-linecap="round"/><path d="M77 21 95 9 89 29 83 23 75 29Z" fill="#75bdff"/></svg><span class="aero-word">eroScope</span><span class="aero-one">ONE<sup>™</sup></span></span></div><div class="headright"><small>Live regional radar • Beta</small><a class="signin" href="/profile">My Account</a></div></header><nav><button class="active" data-tab="radar">Flight Radar</button><button data-tab="atc">ATC Lab</button><button data-tab="window">Window View</button><button data-tab="sim">Simulation</button></nav><div id="status">Loading map…</div><main id="map"><div id="toolbar"><input id="search" placeholder="Search loaded flights" aria-label="Search flight"><button id="refresh">↻ Refresh</button></div></main><div id="panel"><b>Tap a plane to inspect it.</b><p>Move the map to load nearby aircraft. Flight positions depend on public receiver coverage.</p></div><section id="other"></section><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[-73.87,40.77],zoom:7});map.addControl(new maplibregl.NavigationControl(),'bottom-right');
const status=document.getElementById('status'),panel=document.getElementById('panel'),search=document.getElementById('search');let aircraft=[],markers=[],timer;
function text(s){return String(s??'—').replace(/[<>&"'\x60]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;','\x60':'&#96;'}[c]));}
function render(){markers.forEach(m=>m.remove());markers=[];let q=search.value.trim().toUpperCase();for(const a of aircraft){if(q&&!((a.flight||'')+' '+(a.r||'')+' '+(a.hex||'')).toUpperCase().includes(q))continue;if(typeof a.lat!=='number'||typeof a.lon!=='number')continue;let el=document.createElement('div');el.className='plane';el.textContent='✈';el.style.transform='rotate('+((a.track||0)-45)+'deg)';el.title=a.flight||a.r||a.hex||'Aircraft';let m=new maplibregl.Marker({element:el,rotation:a.track||0,rotationAlignment:'map'}).setLngLat([a.lon,a.lat]).addTo(map);el.onclick=()=>{panel.innerHTML='<b>✈ '+text((a.flight||a.r||a.hex||'Unknown').trim())+'</b><p>Aircraft: '+text(a.t||a.desc||'Unknown')+' · Registration: '+text(a.r)+'</p><p>Altitude: '+text(a.alt_baro)+' ft · Groundspeed: '+text(a.gs)+' kt · Heading: '+text(a.track)+'°</p><p>Last position seen: '+text(a.seen_pos)+' s ago. Some details may be unavailable.</p>'};markers.push(m);}status.textContent='Nearby reported aircraft: '+markers.length+' / '+aircraft.length+' • Public receiver coverage varies';}
async function load(){const c=map.getCenter();status.textContent='Loading aircraft around '+c.lat.toFixed(2)+', '+c.lng.toFixed(2)+'…';try{const res=await fetch('/api/aircraft?lat='+c.lat.toFixed(3)+'&lon='+c.lng.toFixed(3),{cache:'no-store'});const data=await res.json();if(!res.ok)throw Error(data.error||'HTTP '+res.status);aircraft=Array.isArray(data.ac)?data.ac:[];render();}catch(e){status.textContent='Live tracking unavailable: '+e.message+' • Map still works';aircraft=[];render();status.textContent='Live tracking unavailable: '+e.message+' • Please try Refresh';}}
map.on('load',load);map.on('moveend',()=>{clearTimeout(timer);timer=setTimeout(load,900)});document.getElementById('refresh').onclick=load;search.oninput=render;setInterval(()=>{if(document.visibilityState==='visible'&&!document.hidden&&document.querySelector('[data-tab="radar"]').classList.contains('active'))load()},30000);
document.querySelectorAll('[data-tab]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b===btn));let tab=btn.dataset.tab;document.getElementById('map').style.display=tab==='radar'?'block':'none';panel.style.display=tab==='radar'?'block':'none';let o=document.getElementById('other');o.style.display=tab==='radar'?'none':'block';if(tab==='atc')o.innerHTML='<h2>ATC Lab</h2><p>Training sample only — not live ATC.</p><button onclick="speechSynthesis.speak(new SpeechSynthesisUtterance(\'AeroScope 123, cleared for takeoff runway two two left\'))">▶ Play simulated ATC</button>';if(tab==='window')o.innerHTML='<h2>Passenger Window</h2><p>Simulated sky — not a live exterior camera.</p><div style="height:50vh;border:16px solid #c8d7e2;border-radius:45%;background:linear-gradient(#1d71c0,#a6dfff 68%,#e8f5ff);position:relative;overflow:hidden"><div style="position:absolute;bottom:20%;left:20%;width:90%;height:18px;background:#e6edf4;transform:rotate(-15deg);border-radius:80% 0"></div></div>';if(tab==='sim')o.innerHTML='<h2>Simulation Lab</h2><p>Try a flight heading exercise.</p><label>Heading <input id="h" type="range" min="0" max="359" value="90" oninput="document.getElementById(\'heading\').textContent=this.value+\'°\'"></label><p>Selected heading: <strong id="heading">90°</strong></p>';if(tab==='radar')map.resize()});
</script><script src="/enhancements.js"></script><footer aria-label="Legal and support" style="display:flex;flex-wrap:wrap;justify-content:center;gap:18px;padding:20px 12px;background:#0b1830;color:#b8cadb;font-size:13px"><a style="color:#91d2ff" href="/privacy">Privacy Policy</a><a style="color:#91d2ff" href="/terms">Terms of Service</a><a style="color:#91d2ff" href="mailto:aeroscopefly@gmail.com">Support</a></footer></body></html>

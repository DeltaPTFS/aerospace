async function loadPhoto(a,hex){

   if(p.searchPage){const link=document.createElement('a');link.href=p.searchPage;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Browse aircraft photos on Wikimedia Commons';box.append(link)}

async function loadLicensedFlightStatus(a,hex){

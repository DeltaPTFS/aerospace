<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071222"><title>AeroScope ONE</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="apple-touch-icon" href="/favicon.svg"><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#071222;color:#f2f8ff;font:15px -apple-system,BlinkMacSystemFont,Arial,sans-serif}header{height:65px;display:flex;justify-content:space-between;align-items:center;padding:12px 17px;background:#0b1830}b{letter-spacing:.3px}.brand{font-size:20px}.brand span{color:#59c8ff}button,input{font:inherit}button{background:#172f4d;border:1px solid #355679;border-radius:12px;color:white;padding:11px 14px;cursor:pointer}button.active{background:#176aa0}nav{display:flex;gap:7px;overflow:auto;padding:10px;background:#0d1b31}nav button{white-space:nowrap}#map{position:relative;height:calc(100dvh - 202px);min-height:300px}#status{padding:8px 13px;font-size:12px;background:#11263d;color:#a9d8f4;min-height:34px}#panel{background:#0b1a30;padding:12px 15px;min-height:80px}#panel p{margin:6px 0;color:#b8cadb}#toolbar{position:absolute;z-index:2;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none}#toolbar>*{pointer-events:auto}#search{width:100%;min-width:0;background:#0a2038;color:#fff;border:1px solid #47708f;border-radius:12px;padding:12px}#refresh{white-space:nowrap}.plane{width:15px;height:19px;display:grid;place-items:center;cursor:pointer;filter:drop-shadow(0 1px 2px #001a30aa);touch-action:manipulation}.plane svg{display:block;width:100%;height:100%;overflow:visible}.plane:focus-visible{outline:2px solid #fff;border-radius:4px}#other{padding:20px;display:none}small{color:#acc4d3}.maplibregl-popup-content{background:#10263d;color:#fff;border-radius:10px}.maplibregl-popup-tip{border-top-color:#10263d!important}.maplibregl-ctrl-group button{padding:0}@media(max-width:500px){header{height:58px}#map{height:calc(100dvh - 210px)}.brand{font-size:18px}} header .signin{color:white;background:#176aa0;border:1px solid #4789b5;border-radius:10px;padding:9px 12px;font-size:13px;text-decoration:none;white-space:nowrap}header .headright{display:flex;align-items:center;gap:10px}header .headright small{white-space:nowrap}@media(max-width:550px){header .headright small{display:none}}.aero-wordmark{display:inline-flex;align-items:baseline;gap:0;color:#79c8ff;font-family:Arial,Helvetica,sans-serif;font-weight:800;letter-spacing:-.75px;white-space:nowrap;font-size:25px;line-height:1}.aero-symbol{width:31px;height:26px;flex-shrink:0;align-self:baseline;vertical-align:baseline;position:relative;top:3px;margin-right:-5px;overflow:visible}.aero-word{color:#79c8ff}.aero-one{color:#79c8ff;margin-left:.25em;font-size:1em;letter-spacing:-.75px}.aero-one sup{font-size:.40em;position:relative;top:-.52em;vertical-align:baseline;margin-left:.05em;line-height:0}@media(max-width:500px){.aero-wordmark{font-size:20px}.aero-symbol{width:26px;height:23px;top:3px;margin-right:-4px}}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.detail-row{background:#102943;padding:8px;border-radius:8px;min-width:0;overflow-wrap:anywhere}.detail-row span{display:block;color:#a8c5dc;font-size:11px}.detail-row strong{display:block;margin-top:3px;font-size:13px}.aircraft-photo,.atc-info{background:#102943;border-radius:12px;margin:12px 0;padding:12px}.atc-info p{font-size:13px}.atc-info a{color:#91d2ff}#search-results{position:absolute;top:62px;left:0;right:0;z-index:8;background:#0a1c32f5;border:1px solid #47708f;border-radius:12px;max-height:48vh;overflow-y:auto;box-shadow:0 12px 28px #0008;padding:8px}#search-results[hidden]{display:none}#search-results button{display:block;text-align:left;width:100%;margin:3px 0;border-radius:8px;padding:11px;background:#152d49}#search-results .result-note{color:#bbd1e6;font-size:12px;margin:7px}#search-results .sub{font-size:12px;color:#a9c3da;display:block;margin-top:3px}.atc-freq{display:grid;grid-template-columns:1fr 1fr;gap:6px}.atc-freq div{background:#172f4d;padding:9px;border-radius:8px;font-size:12px}.atc-freq strong{display:block;color:#aadeff;margin-bottom:4px}.flight-detail-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}.flight-detail-head h2{margin:0;color:#a8ddff}.flight-status{font-size:12px;background:#123f56;border-radius:18px;padding:6px 11px;color:#a8ebff}.aircraft-photo{background:#102439;border:1px solid #315271;border-radius:14px;padding:12px;max-width:620px;margin:14px auto;text-align:center;min-height:100px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px}.aircraft-picture{display:block;width:100%;max-width:490px;max-height:280px;aspect-ratio:16/9;object-fit:contain;background:#081827;border-radius:9px}.aircraft-caption{font-size:12px;color:#bdd0e0;margin:5px 0;text-align:center}.aircraft-photo a,.atc-accordion a{color:#8ed5ff;font-size:12px}.schedule-box{border:1px solid #385375;background:#0f253d;padding:12px;border-radius:12px;margin-top:13px}.schedule-box h3{font-size:16px;margin:0 0 10px}.data-disclaimer{font-size:12px;line-height:1.5;color:#afc5da}.atc-accordion{border:1px solid #355a7d;border-radius:13px;margin-top:20px;overflow:hidden;background:#10243c}.atc-accordion summary{padding:15px;cursor:pointer;background:#183654;display:flex;flex-direction:column;gap:4px}.atc-accordion summary span{font-size:12px;color:#c2d5e5}.atc-body{padding:14px}.atc-body p{line-height:1.45;font-size:13px}.atc-service-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.atc-service-grid div{background:#142e4a;padding:9px;border-radius:9px;min-width:0}.atc-service-grid b{display:block;color:#a8dfff;margin-bottom:4px}.atc-service-grid span{font-size:12px;color:#bad0e3}.atc-lookup{margin:14px 0;background:#0b1b30;padding:12px;border-radius:10px}.atc-lookup label{font-weight:700;font-size:14px}.atc-lookup-row{display:flex;gap:7px;margin-top:9px}.atc-lookup-row input{min-width:0;flex:1;padding:11px;background:#091b31;color:#fff;border:1px solid #46688c;border-radius:9px}.atc-lookup-row button{white-space:nowrap;padding:9px 11px}.atc-recording-state{padding:11px;background:#1b3046;border-radius:9px}.atc-recording-state button:disabled{opacity:.55;cursor:not-allowed}@media(max-width:480px){.aircraft-picture{max-height:220px}.atc-service-grid{grid-template-columns:1fr 1fr}.atc-lookup-row{flex-wrap:wrap}.atc-lookup-row button{width:100%}}</style><link rel="stylesheet" href="/enhancements.css"></head><body><header><div class="brand"><span class="aero-wordmark"><svg class="aero-symbol" viewBox="0 0 102 76" role="img" aria-label="AeroScope logo"><path d="M9 70 40 6 Q43 1 47 6 L78 70 H60 L44 32 27 70Z" fill="#75bdff"/><path d="M4 58 C27 66 60 51 91 24" fill="none" stroke="#e7f7ff" stroke-width="6" stroke-linecap="round"/><path d="M77 21 95 9 89 29 83 23 75 29Z" fill="#75bdff"/></svg><span class="aero-word">eroScope</span><span class="aero-one">ONE<sup>™</sup></span></span></div><div class="headright"><small>Live regional radar • Beta</small><a class="signin" href="/profile">My Account</a></div></header><nav><button class="active" data-tab="radar">Flight Radar</button><button data-tab="atc">ATC Lab</button><button data-tab="window">Window View</button><button data-tab="sim">Simulation</button></nav><div id="status">Loading map…</div><main id="map"><div id="toolbar"><input id="search" placeholder="Search callsign, flight, airline…" aria-label="Search aircraft and airlines" autocomplete="off"><button id="refresh">↻ Refresh</button><div id="search-results" role="region" aria-label="Flight search results" hidden></div></div></main><div id="panel"><b>Tap a plane to inspect it.</b><p>Move the map to load nearby aircraft. Flight positions depend on public receiver coverage.</p></div><section id="other"></section><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[-73.87,40.77],zoom:7});map.addControl(new maplibregl.NavigationControl(),'bottom-right');
const status=document.getElementById('status'),panel=document.getElementById('panel'),search=document.getElementById('search');
let aircraft=[],timer,activeHex=null,refreshing=false;
const markers=new Map(),planeSVG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 40" aria-hidden="true"><path d="M16 1.5c2.5 0 3.6 5 3.8 12.3L30 22v4l-10.2-3.3-.4 8.2 5.1 3.8v2.5L16 35l-8.5 2.2v-2.5l5.1-3.8-.4-8.2L2 26v-4l10.2-8.2C12.4 6.5 13.5 1.5 16 1.5Z" fill="#65c8ff" stroke="#07385d" stroke-width="1.35" stroke-linejoin="round"/><path d="M16 4v27" stroke="#e7f8ff" stroke-width="1.7" stroke-linecap="round"/></svg>';
function text(s){return String(s??'—').replace(/[<>&"'\x60]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;','\x60':'&#96;'}[c]));}
function info(label,value,unit=''){const v=value===undefined||value===null||value===''?'Not reported':String(value)+unit;return '<div class="detail-row"><span>'+text(label)+'</span><strong>'+text(v)+'</strong></div>'}
const airlineIata={AA:'AAL',DL:'DAL',UA:'UAL',B6:'JBU',WN:'SWA',F9:'FFT',NK:'NKS',AS:'ASA',BA:'BAW',LH:'DLH',AF:'AFR',EK:'UAE',QR:'QTR',AC:'ACA',YX:'RPA',MQ:'ENY',OH:'JIA',OO:'SKW'};const airlineAliases={RPA:'Republic Airways',ENY:'Envoy Air',JIA:'PSA Airlines',SKW:'SkyWest Airlines'};
const airlineCodes={DAL:'Delta Air Lines',AAL:'American Airlines',UAL:'United Airlines',JBU:'JetBlue',SWA:'Southwest Airlines',FFT:'Frontier Airlines',NKS:'Spirit Airlines',ASA:'Alaska Airlines',BAW:'British Airways',DLH:'Lufthansa',AFR:'Air France',KLM:'KLM',UAE:'Emirates',QTR:'Qatar Airways',ACA:'Air Canada'};
function airlineFor(a){const code=(a.flight||'').trim().slice(0,3).toUpperCase();return airlineCodes[code]||airlineAliases[code]||''}
async function loadPhoto(a,hex){
 const airline=airlineFor(a),type=a.t||'',reg=a.r||'',box=document.getElementById('aircraft-photo');
 if(!box)return;
 box.textContent='Looking for a verified aircraft or fleet photograph…';
 try{
  const qs=new URLSearchParams({hex:hex||'',reg,type,airline});
  const r=await fetch('/api/aircraft-photo?'+qs.toString());
  const p=await r.json();if(activeHex!==hex||!document.getElementById('aircraft-photo'))return;
  if(!r.ok||!p.url){
   box.replaceChildren();const note=document.createElement('p');note.textContent='No confirmed photograph available for this aircraft or model yet.';box.append(note);
   if(p.searchPage){const link=document.createElement('a');link.href=p.searchPage;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Browse aircraft photos on Wikimedia Commons';box.append(link)}
   return;
  }
  const img=document.createElement('img');img.src=p.url;img.alt='Aircraft photo: '+(p.model||type);img.loading='lazy';img.referrerPolicy='no-referrer';img.className='aircraft-picture';
  const caption=document.createElement('p');caption.className='aircraft-caption';
  caption.textContent=p.kind==='registration'?'Photo linked to this aircraft identification. Livery and date may differ from today.':p.kind==='same-airline-model'?'Representative fleet photo: same reported airline and aircraft model, not necessarily this aircraft.':'Aircraft type example only; airline and registration may differ.';
  const credit=document.createElement('a');credit.textContent=p.credit||'Photo information and license';credit.href=p.page||'https://commons.wikimedia.org/';credit.target='_blank';credit.rel='noopener noreferrer';
  img.onerror=()=>{img.remove();caption.textContent='Photo provider could not load the image. Use the image source link below.'};
  box.replaceChildren(img,caption,credit);
 }catch{box.textContent='The photo directory is temporarily unavailable.'}
}
function details(a){
 if(!a)return;const hex=a.hex||'',call=(a.flight||a.hex||'Unknown').trim();activeHex=hex;
 const alt=a.alt_baro==='ground'?'On ground':a.alt_baro;
 const statusLabel=a.alt_baro==='ground'?'Reported on ground':typeof a.alt_baro==='number'?'Reported airborne':'Status unknown';
 panel.innerHTML='<div class="flight-detail-head"><h2>Flight '+text(call)+'</h2><div class="flight-status">'+text(statusLabel)+'</div></div>'
 +'<div id="aircraft-photo" class="aircraft-photo">Looking up aircraft imagery…</div>'
 +'<section class="schedule-box"><h3>Flight route & times</h3><div class="detail-grid">'
 +info('Departure airport','Not available')+info('Arrival airport','Not available')
 +info('Scheduled departure','Not available')+info('Actual departure','Not available')
 +info('Scheduled arrival','Not available')+info('Estimated arrival','Not available')
 +'</div><p class="data-disclaimer">Live ADS-B positions do not include airline schedules or confirmed departure/arrival times. These fields require a separate flight-status data source; no times are invented.</p></section>'
 +'<h3 style="margin:18px 0 9px">Aircraft & live position</h3><div class="detail-grid">'
 +info('Airline (callsign estimate)',airlineFor(a)||'Not identified')+info('Callsign',a.flight?.trim())+info('Registration',a.r)+info('Aircraft type',a.t)+info('Description',a.desc)+info('ICAO hex',a.hex)
 +info('Barometric altitude',alt,typeof alt==='number'?' ft':'')+info('Geometric altitude',a.alt_geom,' ft')+info('Ground speed',a.gs,' kt')+info('Heading',a.track,'°')
 +info('Vertical speed',a.baro_rate,' ft/min')+info('Squawk',a.squawk)+info('Emergency',a.emergency)
 +info('Latitude',a.lat?.toFixed(5))+info('Longitude',a.lon?.toFixed(5))+info('Position age',a.seen_pos,' seconds')+info('Position source',a.type)+info('Aircraft category',a.category)
 +'</div>'
 +'<details class="atc-accordion"><summary><strong>ATC communications & frequencies</strong><span>View services & available recordings</span></summary>'
 +'<div class="atc-body"><p>AeroScope does not currently have verified aircraft-specific ATC audio or transcripts. Flight tracking data cannot tell us which frequency a pilot is using or exactly what was said.</p>'
 +'<div class="atc-service-grid"><div><b>Ground</b><span>Taxi and ramp-area instructions</span></div><div><b>Tower</b><span>Runway, takeoff and landing clearances</span></div><div><b>Departure</b><span>After takeoff and initial climb</span></div><div><b>Approach</b><span>Arrival and approach sequencing</span></div><div><b>Center</b><span>En-route air traffic control</span></div><div><b>ATIS</b><span>Recorded weather and airport information</span></div></div>'
 +'<div class="atc-lookup"><label for="atc-airport">Find real airport radio feeds</label><div class="atc-lookup-row"><input id="atc-airport" maxlength="4" placeholder="ICAO code (KJFK)" autocapitalize="characters"><button id="atc-find" type="button">Find feeds</button></div><p>Opens LiveATC.net, where legally available. Audio may be incomplete and must not be presented as an exact transcript of this flight.</p></div>'
 +'<div class="atc-recording-state"><strong>Playback / Transcript</strong><p>No licensed recording matched to '+text(call)+'.</p><button disabled>▶ No verified recording</button></div></div></details>';
 const btn=document.getElementById('atc-find');
 if(btn)btn.onclick=()=>{const code=(document.getElementById('atc-airport').value||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length<3){document.getElementById('atc-airport').focus();return}window.open('https://www.liveatc.net/search/?icao='+encodeURIComponent(code),'_blank','noopener,noreferrer')};
 loadPhoto(a,hex);
}
const resultBox=document.getElementById('search-results');
function searchable(a){const callsign=(a.flight||'').trim().toUpperCase();const airline=airlineFor(a);const codes=Object.entries(airlineIata).filter(([,icao])=>callsign.startsWith(icao)).map(([iata,icao])=>iata+callsign.slice(icao.length));return [callsign,a.r,a.hex,a.t,a.desc,airline,...codes].filter(Boolean).join(' ').toUpperCase()}
function results(){const q=search.value.trim().toUpperCase();if(!q){resultBox.hidden=true;resultBox.replaceChildren();return}const matches=aircraft.filter(a=>searchable(a).includes(q));resultBox.hidden=false;resultBox.replaceChildren();const heading=document.createElement('p');heading.className='result-note';heading.textContent=matches.length+' matching aircraft currently loaded in this map area';resultBox.appendChild(heading);for(const a of matches.slice(0,30)){const b=document.createElement('button');const call=(a.flight||a.hex||'Unknown').trim();b.textContent=call+' · '+(airlineFor(a)||'Airline unavailable');const sub=document.createElement('span');sub.className='sub';sub.textContent=[a.t,a.r,a.alt_baro==='ground'?'On ground':(typeof a.alt_baro==='number'?a.alt_baro+' ft':'')].filter(Boolean).join(' · ');b.appendChild(sub);b.onclick=()=>{resultBox.hidden=true;search.value='';render();details(a);map.flyTo({center:[a.lon,a.lat],zoom:Math.max(map.getZoom(),9),essential:true});document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'nearest'})};resultBox.appendChild(b)}if(matches.length>30){const n=document.createElement('p');n.className='result-note';n.textContent='Showing first 30 matches. Refine your search for more.';resultBox.appendChild(n)}if(!matches.length){const n=document.createElement('p');n.className='result-note';n.textContent='No match in this regional feed. Search is not a global airline schedule or route database.';resultBox.appendChild(n)}}
function positionBetween(start,end,t){return [start[0]+(end[0]-start[0])*t,start[1]+(end[1]-start[1])*t]}
function animateMarker(item,to){
 const from=item.marker.getLngLat(),initial=[from.lng,from.lat],target=[to.lon,to.lat];
 if(item.animation)cancelAnimationFrame(item.animation);
 if(Math.abs(target[0]-initial[0])>1||Math.abs(target[1]-initial[1])>1){item.marker.setLngLat(target);return}
 const began=performance.now(),duration=17000;
 function frame(now){if(!document.contains(item.el))return;const t=Math.min((now-began)/duration,1);item.marker.setLngLat(positionBetween(initial,target,t));if(t<1)item.animation=requestAnimationFrame(frame)}
 item.animation=requestAnimationFrame(frame);
}
function render(){
 const q=search.value.trim().toUpperCase(),seen=new Set();let count=0;
 for(const a of aircraft){
  if(q&&!searchable(a).includes(q))continue;
  if(typeof a.lat!=='number'||typeof a.lon!=='number')continue;
  const id=a.hex||((a.flight||'').trim()+'-'+a.lat+'-'+a.lon);seen.add(id);count++;
  let item=markers.get(id);
  if(!item){
   const el=document.createElement('div');el.className='plane';el.innerHTML=planeSVG;el.title=a.flight||a.r||a.hex||'Aircraft';el.setAttribute('role','button');el.setAttribute('tabindex','0');el.setAttribute('aria-label','Details for '+el.title);
   const m=new maplibregl.Marker({element:el,rotation:Number(a.track)||0,rotationAlignment:'map'}).setLngLat([a.lon,a.lat]).addTo(map);
   item={marker:m,el,aircraft:a,animation:null};markers.set(id,item);
   el.onclick=()=>details(item.aircraft);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();details(item.aircraft)}};
  }else{item.aircraft=a;animateMarker(item,a);item.marker.setRotation(Number(a.track)||0)}
 }
 for(const [id,item] of markers){if(!seen.has(id)){if(item.animation)cancelAnimationFrame(item.animation);item.marker.remove();markers.delete(id)}}
 if(activeHex){const current=aircraft.find(a=>a.hex===activeHex);if(current){/* Keep details stable while markers update */}else activeHex=null}
 status.textContent='Nearby reported aircraft: '+count+' / '+aircraft.length+' • Positions update about every 30 seconds';
}
async function load(){
 if(refreshing||document.hidden)return;refreshing=true;
 const c=map.getCenter();status.textContent='Updating aircraft positions…';
 try{const res=await fetch('/api/aircraft?lat='+c.lat.toFixed(3)+'&lon='+c.lng.toFixed(3),{cache:'no-store'});const data=await res.json();if(!res.ok)throw Error(data.error||'HTTP '+res.status);aircraft=Array.isArray(data.ac)?data.ac:[];render();if(search.value.trim())results()}
 catch(e){status.textContent='Live tracking temporarily unavailable: '+e.message+' • Existing positions may be old'}
 finally{refreshing=false}
}
map.on('load',load);map.on('moveend',()=>{clearTimeout(timer);timer=setTimeout(load,900)});
document.getElementById('refresh').onclick=load;search.oninput=()=>{render();results()};search.addEventListener('keydown',e=>{if(e.key==='Escape'){search.value='';results();render()}});
setInterval(()=>{if(document.visibilityState==='visible'&&document.querySelector('[data-tab="radar"]').classList.contains('active'))load()},30000);
document.querySelectorAll('[data-tab]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b===btn));let tab=btn.dataset.tab;document.getElementById('map').style.display=tab==='radar'?'block':'none';panel.style.display=tab==='radar'?'block':'none';let o=document.getElementById('other');o.style.display=tab==='radar'?'none':'block';if(tab==='atc')o.innerHTML='<h2>ATC Lab</h2><p>Training sample only — not live ATC.</p><button onclick="speechSynthesis.speak(new SpeechSynthesisUtterance(\'AeroScope 123, cleared for takeoff runway two two left\'))">▶ Play simulated ATC</button>';if(tab==='window')o.innerHTML='<h2>Passenger Window</h2><p>Simulated sky — not a live exterior camera.</p><div style="height:50vh;border:16px solid #c8d7e2;border-radius:45%;background:linear-gradient(#1d71c0,#a6dfff 68%,#e8f5ff);position:relative;overflow:hidden"><div style="position:absolute;bottom:20%;left:20%;width:90%;height:18px;background:#e6edf4;transform:rotate(-15deg);border-radius:80% 0"></div></div>';if(tab==='sim')o.innerHTML='<h2>Simulation Lab</h2><p>Try a flight heading exercise.</p><label>Heading <input id="h" type="range" min="0" max="359" value="90" oninput="document.getElementById(\'heading\').textContent=this.value+\'°\'"></label><p>Selected heading: <strong id="heading">90°</strong></p>';if(tab==='radar')map.resize()});
</script><script src="/enhancements.js"></script><footer aria-label="Legal and support" style="display:flex;flex-wrap:wrap;justify-content:center;gap:18px;padding:20px 12px;background:#0b1830;color:#b8cadb;font-size:13px"><a style="color:#91d2ff" href="/privacy">Privacy Policy</a><a style="color:#91d2ff" href="/terms">Terms of Service</a><a style="color:#91d2ff" href="mailto:aeroscopefly@gmail.com">Support</a></footer></body></html>
